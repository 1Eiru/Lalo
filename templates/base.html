<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion Events</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <style>
        .grid-item {
            height: 165px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; 
            background-color: rgba(0,0,0,0.05);
            border-radius: 8px;
        }
        .item-count {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }
        img {
            display: block;
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
        }
        @media (max-width: 768px) {
            .grid-item { height: 100px; margin-bottom: 10px; }
            .item-count { font-size: 0.75rem; padding: 1px 4px; }
            h6 { font-size: 0.9rem; }
        }
        .killer-link { color: #212529; text-decoration: none; transition: color 0.2s ease-in-out; }
        .killer-link:hover { color: #0d6efd !important; text-decoration: underline; font-weight: bold; }
        .victim-link { color: #212529; text-decoration: none; transition: color 0.2s ease-in-out; }
        .victim-link:hover { color: #dc3545 !important; text-decoration: underline; font-weight: bold; }
        .search-container {
            position: relative;
            width: 100%;
            max-width: 350px;
        }
        #searchResults {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 1050;
            max-height: 400px;
            overflow-y: auto;
            display: none; 
            background-color: white;
            border: 1px solid rgba(0,0,0,.125);
        }
        .search-result-item {
            cursor: pointer;
            border-left: none;
            border-right: none;
        }
        .search-result-item:hover {
            background-color: #f8f9fa;
        }

        .nav-pill-custom {
            display: inline-block;
            padding: 5px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        
        .pill-blue {
            background-color: #e7f1ff;
            color: #0d6efd;
            border: 1px solid transparent;
        }
        .pill-blue:hover {
            background-color: #0d6efd;
            color: white;
        }
        .pill-red {
            background-color: #ffe7e7;
            color: #dc3545;
            border: 1px solid transparent;
        }
        .pill-red:hover {
            background-color: #dc3545;
            color: white;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="container mt-3">
        <!-- HEADER -->
        <div class="d-flex flex-wrap justify-content-between align-items-end border-bottom pb-3 mb-3 gap-3">
            <div>
                <h1 class="mb-2">
                    <a href="{{url_for('home')}}" style="text-decoration: none; color: #000000;">
                        AO Killboard
                    </a>
                </h1>
                <div class="d-flex gap-2">
                    <a href="{{url_for('home')}}" class="nav-pill-custom pill-blue">
                        Recent Kills
                    </a>
                    <a href="{{url_for('battles')}}" class="nav-pill-custom pill-red">
                        Recent Battles
                    </a>
                </div>
            </div>

            <!-- RIGHT: SEARCH INPUT -->
            <div class="search-container">
                <input type="text" id="playerSearch" class="form-control" placeholder="Search Player (IGN)..." autocomplete="off">
                <div id="searchResults" class="list-group shadow"></div>
            </div>
        </div>

    </div>
    {% block content %}{% endblock %}

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('playerSearch');
            const resultsBox = document.getElementById('searchResults');
            let debounceTimer;

            if (!searchInput || !resultsBox) return;
            searchInput.addEventListener('input', function(e) {
                const query = e.target.value.trim();
                
                clearTimeout(debounceTimer);
                
                if (query.length < 2) {
                    resultsBox.style.display = 'none';
                    resultsBox.innerHTML = '';
                    return;
                }
                debounceTimer = setTimeout(() => {
                    fetch(`/api/search?q=${encodeURIComponent(query)}`)
                        .then(response => response.json())
                        .then(data => {
                            resultsBox.innerHTML = '';
                            
                            if (data.players && data.players.length > 0) {
                                data.players.forEach(player => {
                                    const kFame = player.KillFame.toLocaleString();
                                    const guildInfo = player.GuildName ? ` <span class="text-muted small">| [${player.GuildName}]</span>` : '';
                                    
                                    const a = document.createElement('a');
                                    a.href = `/player/${player.Id}`;
                                    a.className = 'list-group-item list-group-item-action search-result-item';
                                    a.innerHTML = `
                                        <div class="d-flex w-100 justify-content-between">
                                            <h6 class="mb-1 fw-bold">${player.Name}${guildInfo}</h6>
                                        </div>
                                        <small class="text-danger">⚔️ ${kFame}</small>
                                    `;
                                    resultsBox.appendChild(a);
                                });
                                resultsBox.style.display = 'block';
                            } else {
                                resultsBox.innerHTML = '<div class="list-group-item text-muted">No players found</div>';
                                resultsBox.style.display = 'block';
                            }
                        })
                        .catch(err => {
                            console.error('Search error:', err);
                            resultsBox.style.display = 'none';
                        });
                }, 400);
            });
            searchInput.addEventListener('focus', function() {
                if (searchInput.value.trim().length >= 2 && resultsBox.childElementCount > 0) {
                    resultsBox.style.display = 'block';
                }
            });
            document.addEventListener('click', function(e) {
                if (!searchInput.contains(e.target) && !resultsBox.contains(e.target)) {
                    resultsBox.style.display = 'none';
                }
            });
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
